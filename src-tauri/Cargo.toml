[package]
name = "invoice-reimbursement"
version = "0.2.7"
edition = "2024"

[lib]
name = "invoice_reimbursement"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
flate2 = "1"
image = "0.25"
imap = "3.0.0-alpha.15"
infer = "0.19"
keyring = { version = "3", features = ["apple-native"] }
kuchiki = "0.8"
lopdf = "0.36"
mail-parser = "0.11"
native-tls = "0.2"
printpdf = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust_decimal = "1"
rustix = { version = "1", features = ["fs"] }
rqrr = "0.11"
rust_xlsxwriter = "0.90"
sanitize-filename = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.22", default-features = false, features = ["aes256", "compress", "util"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono", "uuid"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "io-util", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
