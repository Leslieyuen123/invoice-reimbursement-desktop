[package]
name = "invoice-reimbursement"
version = "0.1.0"
edition = "2024"

[lib]
name = "invoice_reimbursement"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
image = "0.25"
imap = "3.0.0-alpha.15"
infer = "0.19"
keyring = "3"
lopdf = "0.36"
mail-parser = "0.11"
native-tls = "0.2"
pdf-extract = "0.9"
printpdf = "0.8"
rust_decimal = "1"
rust_xlsxwriter = "0.90"
sanitize-filename = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono", "uuid"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "4"

[dev-dependencies]
pretty_assertions = "1"
